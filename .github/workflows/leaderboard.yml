name: Leaderboard

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "scripts/build_leaderboard.py"
      - "README.md"
      - "README.ru.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pyyaml

      - name: Build leaderboard
        run: python scripts/build_leaderboard.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md README.md README.ru.md
          git diff --cached --quiet || git commit -m "chore: rebuild public leaderboard [skip ci]"
          git push
