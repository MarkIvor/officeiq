# OfficeIQ Bench — English edition.
# Structure must stay in sync with benchmark.yaml (RU):
# same ids, categories, difficulties — only the prompt text differs.
questions:

  - id: com_001
    category: communication
    difficulty: easy
    prompt: |
      Hi. I'm a project manager, and I just got an email from a client — he wrote that he's really happy with the first phase and wants to keep working with us. I'd like to reply briefly and to the point. What should I write? I need to thank him, confirm we're ready for the next phase, and not come across like a corporate robot while doing it.

  - id: com_002
    category: communication
    difficulty: easy
    prompt: |
      I work in the procurement department. One of our suppliers is already 5 days late on a delivery and never warned us — just total silence. I need to write them an email: find out what's going on, get a new timeline, and not slide into aggression while doing it — the relationship with them still matters for now. Help me draft the text.

  - id: com_003
    category: communication
    difficulty: medium
    prompt: |
      Unpleasant situation. My employee Ivan sent a client a report with erroneous data. The client has already noticed and written an unhappy email. I need to respond on behalf of the company — admit the mistake, apologize, but without publicly throwing Ivan under the bus, and show the client that the situation is under control. How would you write this?

  - id: com_004
    category: communication
    difficulty: medium
    prompt: |
      I'm an account manager. A client we've been working with for 3 years is asking for a 30% discount on their next order — says they've earned it through loyalty. The problem: the most I can offer is 10% — the CFO simply won't sign off on anything more. And losing this client is not an option — they're 15% of our revenue. How do I write an email that turns down the 30%, offers 10%, and doesn't offend them?

  - id: com_005
    category: communication
    difficulty: medium
    prompt: |
      I need to write a rejection to a candidate after an interview. The person tried really hard — you could see how much they wanted this job — but their experience in the key area simply isn't enough. I hate template letters like "we'll keep you in mind for future openings" — I want to write something human, without false hope, but not hurtful either. Help.

  - id: com_006
    category: communication
    difficulty: hard
    prompt: |
      A difficult situation. The director of another department sent me a harsh email — he blames my team for missing a deadline and is threatening to escalate to the CEO. Honestly, the fault here is mixed: we did let the schedule slip, but he himself provided us with the data 2 weeks later than the agreed date, and that played a part too. I need to write a reply that doesn't make excuses and doesn't sound like "well, you brought this on yourself" — but doesn't take all the blame either. The goal is to de-escalate and get to a solution. How would you write it?

  - id: com_007
    category: communication
    difficulty: hard
    prompt: |
      I'm the sales director. I just got a message from a major client — they account for 30% of our revenue — saying they're considering moving to a competitor because of "better terms." They give no specifics whatsoever. I can't panic, and I can't look desperate — but I can't lose them either. I need to write an email: find out what exactly isn't working for them, propose a meeting, keep the conversation alive. How do I do this right?

  - id: com_008
    category: communication
    difficulty: hard
    prompt: |
      I'm a PR manager. A former employee has published a social media post accusing our company of a toxic culture. The post is picking up views, and people in the comments are starting to add their own stories. I need to write the company's official response — publicly, in the same space. The difficulty is that I can neither confirm the specific accusations (legal risk) nor pretend that "everything is wonderful" — that would only make things worse. How do I write a response that takes a position and keeps its dignity?

  - id: com_009
    category: communication
    difficulty: hard
    prompt: |
      I need to send an email to all 200 employees of the company with the news that the year-end company party is cancelled — the budget has been cut. We announced it 3 months ago, and people are already looking forward to it. I hate corporate speak and emails in the style of "due to the optimization of budgetary resources." How do I write this honestly, with respect for the people, without clichés — so they understand and don't feel cheated?

  - id: com_010
    category: communication
    difficulty: hard
    prompt: |
      My direct report Alexey messaged me at 10 PM with a question about an urgent task. I've seen the message. The task really is important and can wait until morning, but I need to acknowledge it somehow — simply ignoring it wouldn't be right either. In our company, the boundary of working hours is a matter of principle, and I'm the one championing it. How do I respond so that I neither drop the task nor undermine the culture I'm building?

  - id: meet_001
    category: meetings
    difficulty: easy
    prompt: |
      I need help with a meeting notes template. On our team, everything after meetings gets lost somewhere — who decided what, who's responsible for what. I want to introduce a single template for meeting summaries. What should go into it? It needs to be practical, not just another pretty document.

  - id: meet_002
    category: meetings
    difficulty: easy
    prompt: |
      Every week I run a status meeting for a team of 8 — 30 minutes. The problem: we always run over or lose focus. Help me put together an agenda that actually fits into 30 minutes and doesn't turn into a simple round of "everything's fine with everyone." What should be on it, and in what order?

  - id: meet_003
    category: meetings
    difficulty: medium
    prompt: |
      The day after tomorrow I have a meeting with the project sponsor, and I need to tell him that we're 2 weeks behind schedule. It's not a catastrophe, but he doesn't like surprises and he knows how to ask uncomfortable questions. Help me prepare: what to say, in what order, how to present the delay so I don't look helpless, and which solutions to propose.

  - id: meet_004
    category: meetings
    difficulty: medium
    prompt: |
      My team has a terrible problem with meetings: we schedule an hour, it runs an hour and a half to two. People are already complaining, but the habit is stronger than any reminder. I understand that one announcement won't fix this. What specifically should I do? I need practical steps I can start rolling out as early as next week.

  - id: meet_005
    category: meetings
    difficulty: medium
    prompt: |
      I need to run a strategy session with the top management — 6 people, half a day. The goal: work out priorities for the next quarter. I already know they'll have different positions on the key questions, and they love diving into details and arguing for hours. How do I plan the session so that we actually reach a decision in 4 hours? I need a block structure and specific facilitation methods.

  - id: meet_006
    category: meetings
    difficulty: hard
    prompt: |
      I'm running a meeting as the facilitator. Two managers can't agree on a key issue, the discussion has hit a dead end, and they're starting to get personal — "your department always..." and all that. I don't have the authority to make the decision for them. What do I do right now? Concrete actions and phrases for getting out of this situation — not theory, but what I say at this very second.

  - id: meet_007
    category: meetings
    difficulty: hard
    prompt: |
      My manager just wrote to me: tomorrow morning I'm presenting the quarterly results to the board of directors in his place. I have the data, but there's been no preparation whatsoever. I have one evening before the meeting. How do I use this time as effectively as possible? What do I do first, how do I structure the presentation for the board, and what should I pay special attention to?

  - id: meet_008
    category: meetings
    difficulty: hard
    prompt: |
      I'm a scrum master. I'm running a retrospective after a failed project — the team sits in silence, nobody wants to say anything. The atmosphere is tense, everyone is clearly stung by something, but they keep quiet. What do I do? I need specific activities and an approach that will let people open up, so the meeting produces a real result and not a formal checkmark.

  - id: meet_009
    category: meetings
    difficulty: hard
    prompt: |
      I have 15 minutes with the CFO to get approval for a new tool — 500 thousand rubles a year. The CFO is known for cutting expenses and has no patience for abstract justifications. How do I build the pitch for those 15 minutes? Which arguments, in what order, and how do I handle the objections "that's too expensive" or "make do with what you have"?

  - id: meet_010
    category: meetings
    difficulty: hard
    prompt: |
      I ran a meeting, and everyone verbally agreed to the decision. A day later, two key participants are saying they "didn't mean it that way" and want to revisit it. This isn't the first time. What do I do right now about this particular situation — and what do I put in place systemically so it doesn't happen again?
  - id: doc_001
    category: documents
    difficulty: easy
    prompt: |
      I need to write an internal memo requesting the purchase of 10 laptops for a new department. I've never written one of these before — I don't know what to include or how to format it. Help me out: who do I address it to, what do I write, how do I justify the need, and what exactly am I asking for in the end?

  - id: doc_002
    category: documents
    difficulty: easy
    prompt: |
      We need a quarterly department report for senior management — one page max. My manager doesn't read long texts. What absolutely has to be in a report like this, and what's just extra noise? Suggest a structure that actually works.

  - id: doc_003
    category: documents
    difficulty: medium
    prompt: |
      Weekly meetings in my 12-person team are chaos: some people show up late, some leave early, there's no consistent format. I want to write up rules for how our status meetings are run. What matters to me is that this be a living document people actually read and follow — not another Confluence page nobody ever opens. Help me write it.

  - id: doc_004
    category: documents
    difficulty: medium
    prompt: |
      I received a 15-page services agreement from a contractor. My manager needs a short summary — he won't read the whole contract. How would you approach a task like this? What do you look at first, what makes it into the summary, and what format do you deliver it in?

  - id: doc_005
    category: documents
    difficulty: medium
    prompt: |
      The IT department keeps complaining that requests come in as free-form text and they waste time on clarifying questions. I've been tasked with creating a requirements template for internal IT requests. The catch: the people filling it out won't be techies — just regular employees from other departments. What should go into this template?

  - id: doc_006
    category: documents
    difficulty: hard
    prompt: |
      My manager asked me to write an analysis memo on whether it makes sense to switch to a new CRM. I have the data: supporting the current system costs 1.2M a year, the new one costs 800K a year, but implementation runs 2M. The team complains about the old system, but part of it doesn't want to make the switch. The director has to be able to make a decision within 5 minutes of reading it. How do I structure this document, and what do I put in the executive summary?

  - id: doc_007
    category: documents
    difficulty: hard
    prompt: |
      The project is done. Now I need to write the post-mortem. There were wins — we launched on time, and the client is happy. But there were failures too: the team clashed, and one key milestone nearly slipped because of a planning mistake I made myself. How do I write an honest post-mortem that actually helps us learn — one that doesn't turn into a hunt for the guilty or, at the other extreme, into diplomatic papering-over?

  - id: doc_008
    category: documents
    difficulty: hard
    prompt: |
      The director asked for a one-year roadmap for my department. The problem: the company strategy hasn't been finalized yet, next year's resources are unknown, and the team is already overloaded. Pretending everything is clear and drawing up a nice-looking plan would be dishonest. How do I approach this document under real uncertainty? What do I include, what do I leave open, and how do I justify it?

  - id: doc_009
    category: documents
    difficulty: hard
    prompt: |
      I've been tasked with documenting the contract approval process at our company. The problem: right now the process isn't written down anywhere, everyone does it their own way, and each person is convinced their version is the correct one. How do I gather information for a task like this, and in what format do I describe the process so that the document actually gets used instead of gathering dust?

  - id: doc_010
    category: documents
    difficulty: hard
    prompt: |
      I've been given the task of writing a policy on the use of corporate messengers and email. The company is 300 people, mixed ages, some working remotely. I've seen policies like this before — they're usually written in legalese and nobody reads them. I want to write it differently. How?

  - id: ana_001
    category: analytics
    difficulty: easy
    prompt: |
      I'm choosing between two contractors for corporate training. Contractor A: 20% cheaper, but no reviews from companies like ours — only from small businesses. Contractor B: more expensive, but 3 case studies from exactly our industry. Which one do I pick, and how do I justify it to my manager? I want your reasoning, not just an answer.

  - id: ana_002
    category: analytics
    difficulty: easy
    prompt: |
      I'm looking at this month's numbers: sales are up 15%, but the number of new clients dropped 10%. On the face of it, that sounds good, but something feels off. What conclusions can be drawn from this? What could be behind it, and what do I need to check before making any decisions?

  - id: ana_003
    category: analytics
    difficulty: medium
    prompt: |
      The team has proposed two ways to fix the delays in our document approval process. Option 1: automate the process — expensive, takes 4 months, but after that it runs itself. Option 2: hire a coordinator — can be done in 2 weeks, but it's a permanent salary expense. How do I structure the analysis for making this decision? Which parameters do I compare, and what questions do I ask before choosing?

  - id: ana_004
    category: analytics
    difficulty: medium
    prompt: |
      The company's NPS dropped from 42 to 28 in a quarter — that's serious. At the same time, support says they haven't gotten any more tickets, and sales are stable. What does this mean? Which hypotheses about the causes would I check first, and how exactly?

  - id: ana_005
    category: analytics
    difficulty: medium
    prompt: |
      I have 12 tasks for the quarter and a team of 4. Every task is "important" — that's management's position, anyway. Genuinely taking on all of them is impossible. How do I prioritize? Suggest a method I can actually apply with my team — not abstract theory, but a concrete process that won't turn into endless arguing.

  - id: ana_006
    category: analytics
    difficulty: hard
    prompt: |
      The CEO told me my department is "working toward the wrong goals." Meanwhile, our operational metrics are good — we hit our targets, few errors. I couldn't get any specifics out of him — just "you're not seeing the big picture." I don't understand what he actually means. How do I diagnose this problem, and how do I structure my next conversation with him so I get clarity without coming across as defensive?

  - id: ana_007
    category: analytics
    difficulty: hard
    prompt: |
      I have conflicting data. Sales is reporting 12% revenue growth — and they're right, the numbers check out. Finance shows that margin dropped 8% — and they're right too. Both teams are confident in their numbers and are starting to blame each other. How do I make sense of this situation? Describe the analysis steps and how I handle the conversation with both sides.

  - id: ana_008
    category: analytics
    difficulty: hard
    prompt: |
      I need to make a decision on launching a new product within 48 hours. There's little data — the market is new, and there have been no competitors. The team is split exactly 50/50: half say "let's launch," the other half say "we're not ready." The deadline is driven by an external partner — they're waiting for an answer. How do I make this decision? What process do I use, and how do I explain it to the team afterwards — both if we launch and if we don't?

  - id: ana_009
    category: analytics
    difficulty: hard
    prompt: |
      At year-end, my project missed its KPIs. Honestly: some of the causes were external — the market changed faster than we expected. But some were our own planning mistakes, and I admit that. Tomorrow is the conversation with senior management. How do I prepare for it? What do I acknowledge, what do I explain, what do I propose — and how do I keep the conversation from turning into a trial?

  - id: ana_010
    category: analytics
    difficulty: hard
    prompt: |
      I'm facing a strategic choice: grow fast (high risk, potentially high payoff) or stabilize (low risk, slow growth). The shareholders want growth — they're making that plainly clear. The team is exhausted — that's a fact too. Both options are well-founded. How do I structure the analysis of this choice? Which factors are key, how do I account for the interests of the different parties, and what do I do if they're irreconcilable?
  - id: hr_001
    category: hr_team
    difficulty: easy
    prompt: |
      My employee Maxim has just wrapped up a tough project — on time, despite all the difficulties. I want to give him proper developmental feedback, not just a "good job." Help me write structured feedback: what exactly he did well, what he could improve, and where he should grow next. Maxim is a junior with ambition, and he takes criticism fine.

  - id: hr_002
    category: hr_team
    difficulty: easy
    prompt: |
      A new employee, Maria, joined us two weeks ago. I'm her manager, but honestly our onboarding has always been chaotic — "here's Confluence, figure it out." I want to put together a proper plan for her first 30 days. What does she need to learn, who should she meet, what tasks should she get, and at what pace?

  - id: hr_003
    category: hr_team
    difficulty: medium
    prompt: |
      I have a problem with an employee, Dmitry. For two months now he's been missing deadlines. When I ask, he says "everything's fine, I'm on it." Nothing changes. I'm starting to get frustrated, but I realize frustration won't fix this. How do I have the conversation with him? What do I ask, how do I set clear expectations, and what do I do next if nothing changes after we talk?

  - id: hr_004
    category: hr_team
    difficulty: medium
    prompt: |
      In my team of 6, two people — let's call them Alex and Pasha — are constantly at odds. It's been going on for months. The rest of the team is starting to feel the tension, and our output has slowed down. So far I haven't stepped in — I figured it would blow over. It hasn't. What do I do now? How do I work with each of them individually, and with the team as a whole?

  - id: hr_005
    category: hr_team
    difficulty: medium
    prompt: |
      I need to delegate a high-stakes project to one of two people. Anna is experienced and knows this area better than anyone, but she's currently loaded at almost 100%. Kirill is less experienced, but he has the time and is really eager to take on something challenging. How do I make this decision? What factors do I weigh, and how do I set up support for the one I pick?

  - id: hr_006
    category: hr_team
    difficulty: hard
    prompt: |
      The best person on my team, Sergey, came to me with an offer from a competitor. The gap is 40% on salary. I honestly can't match that — HR said the most I can do is +15%. Sergey matters not just as a specialist — he holds the team culture together. How do I handle this conversation? What do I say, what can I offer beyond money, and how do I decide — fight to keep him at any cost, or let him go?

  - id: hr_007
    category: hr_team
    difficulty: hard
    prompt: |
      I have to tell Olga that her position is being cut. She's been with the company for 7 years and does everything well — it's just that her function is being automated. It's not her fault. I hate these conversations and I've never run one before. How do I structure this conversation? What do I say, in what order, how do I support her as a person and stay honest?

  - id: hr_008
    category: hr_team
    difficulty: hard
    prompt: |
      Based on the performance review results, I can see that one of my employees is consistently underperforming. But: his KPIs are 5% below target — technically, not critical. Everyone likes him. He's a good guy. And that's exactly why no one has ever said anything to him directly. How do I act? What do I say to this person, what do I do systemically, and how do I balance being humane against the real demands for results?

  - id: hr_009
    category: hr_team
    difficulty: hard
    prompt: |
      Today one of my key developers stopped by and told me he's burned out. He says he can't keep working at the same pace, everything irritates him, he has neither the drive nor the energy. Meanwhile, we have several urgent tasks on fire and he can't simply be pulled off the project. What do I do right now, in this conversation? And what happens over the next few weeks — with him, with the team, with the workload?

  - id: hr_010
    category: hr_team
    difficulty: hard
    prompt: |
      I need to put together a team of 5 for a new project. There are 8 candidates within the company. Two of them had a serious falling-out in the past. One is a star, but only performs when he finds the work interesting. Another one is reliable but slow. How do I approach the selection? What criteria do I use, how do I factor in compatibility, and what do I do about the known risks?

  - id: neg_001
    category: negotiations
    difficulty: easy
    prompt: |
      I'm a sales manager. I had a great meeting with a client — he's clearly interested, but at the end he says "we need to think it over." Classic. How do I respond? I want to move the conversation forward without pressuring him or turning into a pushy salesperson.

  - id: neg_002
    category: negotiations
    difficulty: easy
    prompt: |
      The client asks for a discount right before we sign the contract. I can give the discount — I have the authority. But I don't want to set a precedent: if one client gets a discount, the rest will start asking too. Suggest 2-3 response options with different tactics — from soft to hard.

  - id: neg_003
    category: negotiations
    difficulty: medium
    prompt: |
      I need to agree on the terms of a partnership agreement with a company that's significantly stronger than us in the market. They dictate terms and are reluctant to make concessions — you can tell they don't really need us, while we need them. What negotiation strategy do I choose? How do I find the points where I can win a concession without losing the partner?

  - id: neg_004
    category: negotiations
    difficulty: medium
    prompt: |
      Negotiations with a supplier have hit a deadlock on price: I can't go any higher, they can't go any lower — and both sides mean it. It seems like the only way out is a compromise, but there isn't one on the table. What unconventional solutions are possible here? How do I break out of this price deadlock without wrecking the relationship?

  - id: neg_005
    category: negotiations
    difficulty: medium
    prompt: |
      I need to talk to my manager about a raise. I've been here 2 years, my results have been above target for the past year, and I've taken on more responsibility than when I started. But I've never asked for a raise before, and honestly I'm not quite sure how it's done. How do I prepare for this conversation, what arguments do I use, and how do I respond if they say "now is not the best time"?

  - id: neg_006
    category: negotiations
    difficulty: hard
    prompt: |
      We're almost done negotiating a major contract. At the very end, the partner unexpectedly says he wants to revisit a term we discussed at the very beginning and considered closed. That term is unfavorable for us. Clearly, this is a tactic — squeeze us at the last moment, when we've already sunk so much time into the deal. How do I respond right now? And what are my next steps in the process?

  - id: neg_007
    category: negotiations
    difficulty: hard
    prompt: |
      The client is using a manipulative tactic: he claims a competitor offers the same thing 20% cheaper, but shows no proof whatsoever. I don't know if it's true or a bluff. How do I handle this situation? I need specific phrases and a behavioral strategy — I don't want to cave, but I also don't want to offend the client by showing I don't trust him.

  - id: neg_008
    category: negotiations
    difficulty: hard
    prompt: |
      I'm negotiating the project timeline with an internal stakeholder. He wants results in 3 months — and I have solid arguments that it takes 5. He's pushing: "others manage just fine," "make it a priority," "find the resources." How do I hold my ground without turning it into a conflict? And if the pressure keeps up — what do I offer as a compromise?

  - id: neg_009
    category: negotiations
    difficulty: hard
    prompt: |
      Final meeting, the contract is nearly signed. Suddenly a new person shows up on the other side — a lawyer we've never seen before. He starts reopening points that were already agreed: "we're not comfortable with this term," "this needs to be reworded." We've already spent 3 months on these negotiations. How do I act? How do I keep things from sliding back and get the deal signed?

  - id: neg_010
    category: negotiations
    difficulty: hard
    prompt: |
      A contractor is demanding extra payment for work that, as I see it, falls within the original scope. Under the contract, it's a gray area — it can be read either way. The contractor says he'll halt the work otherwise. How do I build my position and handle this dispute? What do I do to resolve it without going to court and without destroying the working relationship?
  - id: str_001
    category: stress
    difficulty: medium
    prompt: |
      This morning three different managers dropped three urgent tasks on me — all of them saying "by end of day". There is no way I can physically get all of it done. Panicking is useless. What do I do in the first 30 minutes? Concrete steps — not "prioritize", but exactly how.

  - id: str_002
    category: stress
    difficulty: medium
    prompt: |
      I'm in the middle of an important project. I just found out that a key team member has fallen ill and will be out on sick leave for at least 2 weeks. The deadline doesn't move — it's an external client, fixed in the contract. What do I do in the first 24 hours? How do I redistribute the workload, and what do I tell the client?

  - id: str_003
    category: stress
    difficulty: medium
    prompt: |
      In an hour I have an important presentation for a client. I just discovered that the data on one of the key slides is wrong. Not catastrophically wrong, but if the client notices, it's going to be awkward. What do I do with this hour? Fix it, own up to it on the spot, or reschedule the meeting — and how do I make that call?

  - id: str_004
    category: stress
    difficulty: hard
    prompt: |
      For the last 3 months I've been working flat out — 10-12 hours a day, weekends included. The results are there, but I can feel myself getting duller: making mistakes in details, snapping over little things, falling asleep in front of my laptop. There's no end to this mode in sight. I understand it's unsustainable, but simply "working less" is not an option — the projects are on fire. How do I get out of this without letting my team down?

  - id: str_005
    category: stress
    difficulty: hard
    prompt: |
      I'm a manager. My team has been in crunch mode for 6 weeks now. People are exhausted, they've started snapping at each other, and one of them has already hinted he's thinking about quitting. Work quality is dropping — I can see it. Meanwhile the projects keep going and the clients keep waiting. What do I actually do — about the workload, about the people, about the client? I need a plan, not wishful thinking.

  - id: str_006
    category: stress
    difficulty: hard
    prompt: |
      A strategic client is suddenly demanding urgent changes to a product we already delivered and had accepted. Formally, this is new scope and we can say no. But this client is 25% of our revenue, and saying "no" is scary. My team is already overloaded with other projects. How do I resolve this resource conflict? What do I tell the client, what do I tell the team, and what do I do with priorities?

  - id: str_007
    category: stress
    difficulty: hard
    prompt: |
      Friday, 5 p.m. A critical bug has been discovered in the system — it's affecting some of our clients. The team already has one foot in the weekend. I'm the one on the hook here. There's no clear protocol for this kind of situation — it's never happened before. What do I do in the first 2 hours? Who do I pull together, what do I communicate, and how do I make the call — work through the weekend or not?

  - id: str_008
    category: stress
    difficulty: hard
    prompt: |
      I work in a matrix structure and report to two managers. Today both of them gave me tasks, both consider theirs the priority, and I'm stuck in the middle. This happens on a regular basis. What do I do in this particular situation? And what do I change systemically so I don't fall into this trap every single time?

  - id: str_009
    category: stress
    difficulty: hard
    prompt: |
      Our project has suddenly become visible at the board of directors level — which is a good thing, but the pressure has shot up. The team is on edge, every decision is now "under the microscope". I can feel myself getting overly cautious in places where I used to just act. How do I manage my own state in this situation, and how do I help the team keep up the pace?

  - id: str_010
    category: stress
    difficulty: hard
    prompt: |
      I have to make an important decision today — it can't be postponed. But I'm feeling severe fatigue and emotional fog: I can tell I'm thinking worse than usual. Admitting this feels awkward, but it's a fact. What do I do? Make the decision now — and how exactly — or find a way to push it back, and how do I do that responsibly?

  - id: eth_001
    category: ethics
    difficulty: medium
    prompt: |
      My manager asked me to "polish the numbers" in a report for a client — to present the data in a more favorable light. Technically it's not a lie — just putting the emphasis on the positive. But the client might make a decision based on a less-than-complete picture. How do I respond to this request? What do I say to my manager?

  - id: eth_002
    category: ethics
    difficulty: medium
    prompt: |
      I've accidentally found out that a colleague I've worked with for a long time and get along well with may be taking kickbacks from a contractor. There's no direct proof — only indirect signs: suspiciously fast approvals, a strange choice of vendors. How do I think about this situation, and what do I do?

  - id: eth_003
    category: ethics
    difficulty: medium
    prompt: |
